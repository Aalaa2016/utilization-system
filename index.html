      const wb = XLSX.read(buf, {type:'array', cellDates:true});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
      const byEmpId = parseMonthlyDataRows(rows);
      const allMatchedIds = Object.keys(byEmpId);
      const empIds = allMatchedIds.filter(id=>{
        const emp = state.employees.find(e=>e.id===id);
        return emp && emp.status==='active_fulltime';
      });
      const skippedCount = allMatchedIds.length - empIds.length;
      if(allMatchedIds.length===0){
        resultBox.textContent = t('importedAttendanceNoMatch');
        return;
      }
      empIds.forEach(empId=>{
        const row = document.querySelector(`#md-table tbody tr[data-emp="${empId}"]`);
        if(!row) return;
        const v = byEmpId[empId];
        const setIf = (sel, val)=>{ if(val!==undefined && val!==null && val!=='') row.querySelector(sel).value = val; };
        setIf('input[data-target]', v.target);
        setIf('input[data-approved]', v.approved);
        setIf('input[data-annual]', v.annual);
        setIf('input[data-unpaid]', v.unpaid);
        setIf('input[data-holiday]', v.holiday);
        setIf('input[data-sick]', v.sick);
      });
      resultBox.innerHTML = `<span class="badge" style="background:#2F7FD422;color:#2F7FD4;">${t('importedAttendanceDays')} ${empIds.length}</span>`
        + (skippedCount>0 ? ` <span class="badge" style="background:var(--muted)22;color:var(--muted);">${t('skippedPartTimeLbl')} ${skippedCount}</span>` : '')
        + ` — ${t('reviewThenSaveNote')}`;
    }catch(e){
      resultBox.textContent = 'Error: ' + e.message;
    }
  };

  document.getElementById('md-save-all').onclick = async ()=>{
    const rows = document.querySelectorAll('#md-table tbody tr[data-emp]');
    const now = new Date().toISOString();
    const approverName = state.currentUser.name;
    document.getElementById('md-save-all').disabled = true;
    try{
      await Promise.all([...rows].map(async row=>{
        const empId = row.getAttribute('data-emp');
        const target = Number(row.querySelector('input[data-target]').value)||0;
        const approved = Number(row.querySelector('input[data-approved]').value)||0;
        const annual = Number(row.querySelector('input[data-annual]').value)||0;
        const unpaid = Number(row.querySelector('input[data-unpaid]').value)||0;
        const holiday = Number(row.querySelector('input[data-holiday]').value)||0;
        const sick = Number(row.querySelector('input[data-sick]').value)||0;
        // Admin/GM Save All records and fully approves the month in one step —
        // it does not require the direct manager to have approved it first.
        await Promise.all([
          saveTargetOverride(empId, monthSel.value, target),
          saveApprovedHours(empId, monthSel.value, approved),
          saveNote(empId, monthSel.value, {annual, unpaid, holiday, sick}),
          approveAllEntries(empId, monthSel.value, approverName),
          saveDataApproval(empId, monthSel.value, {
            status:'gm_approved',
            managerApprovedBy: approverName, managerApprovedAt: now,
            gmApprovedBy: approverName, gmApprovedAt: now,
          }),
        ]);
      }));
    } finally {
      document.getElementById('md-save-all').disabled = false;
    }
    toast(t('savedAllApprovedToast'));
    draw();
  };

  draw();

  async function draw(){
    document.getElementById('md-period').textContent = `${t('fiscalPeriodLbl')} ${fiscalRangeLabel(monthSel.value)}`;
    document.getElementById('md-target-month').textContent = monthLabel(monthSel.value);
    const month = monthSel.value;
    const deptFilter = deptSel.value;
    const activeEmps = state.employees.filter(e=> e.status==='active_fulltime' && (!deptFilter || e.department===deptFilter) && employeeActiveInMonth(e, month) && (showResignedChk.checked || employeeCountsInMonth(e, month)));
    const [targets, approvedMap, notesMap, apprMap] = await Promise.all([
      loadAllTargetsForMonth(activeEmps.map(e=>e.id), month),
      loadAllApprovedForMonth(activeEmps.map(e=>e.id), month),
      loadAllNotesForMonth(activeEmps.map(e=>e.id), month),
      loadAllDataApprovalsForMonth(activeEmps.map(e=>e.id), month),
    ]);
    const tbl = document.getElementById('md-table');
    tbl.innerHTML = `
      <thead><tr>
        <th>${t('thCode')}</th><th>${t('thEmployee')}</th><th>${t('thDept')}</th>
        <th>${t('thTargetHours')}</th><th>${t('thApprovedHours')}</th>
        <th>${t('colAnnual')}</th><th>${t('colUnpaid')}</th><th>${t('colHoliday')}</th><th>${t('colSick')}</th>
        <th>${t('thApprovalStatus')}</th><th></th>
      </tr></thead>
      <tbody>
      ${activeEmps.map(emp=>{
        const counts = employeeCountsInMonth(emp, month);
        const targetOverride = targets[emp.id];
        const target = counts ? effectiveTarget(emp, targetOverride) : ((targetOverride===null||targetOverride===undefined) ? 0 : targetOverride);
        const approved = approvedMap[emp.id]===null || approvedMap[emp.id]===undefined ? '' : approvedMap[emp.id];
        const note = notesMap[emp.id] || {annual:0,unpaid:0,holiday:0,sick:0};

          <td><span class="badge" style="background:${deptOf(emp.department).color}22;color:${deptOf(emp.department).color}">${deptName(emp.department)}</span></td>
          <td><input data-target type="number" value="${target}" style="width:70px;"/></td>

/* ---- Modal: manager approves individual daily timesheet entries (tasks) ---- */
async function openDailyTasksModal(emp, month, approverName, onSaved){
  const backdrop = document.createElement('div');
  backdrop.className='modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal" style="width:640px;">
      <h3>${t('dailyTasksTitle')} ${emp.name} — ${monthLabel(month)}</h3>
      <div id="dt-lock-banner"></div>
      <div style="display:flex;justify-content:flex-end;margin-bottom:10px;">
        <button class="btn btn-sm btn-solid" id="dt-approve-all">${t('approveAllBtn')}</button>
      </div>
      <div class="util-table-wrap"><table id="dt-table"></table></div>
      <div style="display:flex;gap:10px;margin-top:14px;">
        <button class="btn" id="dt-close">${t('closeBtn')}</button>
      </div>
    </div>`;
  document.body.appendChild(backdrop);
  document.getElementById('dt-close').onclick = ()=>{ backdrop.remove(); if(onSaved) onSaved(); };
  document.getElementById('dt-approve-all').onclick = async ()=>{
    const appr = await loadDataApproval(emp.id, month);
    if(appr.status!=='pending') return;
    await approveAllEntries(emp.id, month, approverName);
    await saveDataApproval(emp.id, month, {status:'manager_approved', managerApprovedBy:approverName, managerApprovedAt:new Date().toISOString()});
    toast(t('allEntriesApprovedToast'));
    await drawEntries();
  };
  await drawEntries();

  async function drawEntries(){
    const [entries, appr, attDays] = await Promise.all([loadTimesheet(emp.id, month), loadDataApproval(emp.id, month), loadAttendance(emp.id, month)]);
    entries.sort((a,b)=> a.date<b.date?-1:1);
    const attByDate = {};
    attDays.forEach(d=>{ attByDate[d.date] = d; });
    const locked = appr.status!=='pending';
    const banner = document.getElementById('dt-lock-banner');
    banner.innerHTML = locked ? `<div class="panel" style="background:var(--cyan)11;margin-bottom:10px;font-size:12.5px;">${approvalStatusBadge(appr.status)} — ${t('lockedNote')}</div>` : '';
    document.getElementById('dt-approve-all').style.display = locked ? 'none' : '';

    // group entries by date
    const byDate = {};
    entries.forEach(e=>{ (byDate[e.date] = byDate[e.date] || []).push(e); });
    const allDates = Array.from(new Set([...Object.keys(byDate), ...attDays.map(d=>d.date)])).sort();

    const tbl = document.getElementById('dt-table');
    tbl.innerHTML = `<tr><th></th><th>${t('thType')}</th><th>${t('thProject')}</th><th>${t('thTask')}</th><th>${t('thHours')}</th><th>${t('thLocation')}</th><th>${t('thApprovedCol')}</th></tr>` + (allDates.map(date=>{
      const dayEntries = (byDate[date]||[]).slice();
      const distributed = dayEntries.reduce((a,e)=>a+Number(e.hours||0),0);
      const att = attByDate[date];
      const attStatus = att ? (att.status||'present') : null;
      const attHours = att ? (attStatus==='present' ? att.hours : 0) : null;
      const hasMismatch = att!==undefined && att!==null && Math.abs((attHours||0) - distributed) > 0.01;
      const dayHeaderColor = att===undefined || att===null ? 'var(--muted)' : (hasMismatch ? 'var(--rose)' : 'var(--green)');
      return `
        <tr style="background:#F3F7FB;">
          <td colspan="7" style="padding:8px 10px;">
            <div style="display:flex;flex-wrap:wrap;gap:14px;align-items:center;font-size:12.5px;">
              <b class="mono">📅 ${date}</b>
              <span>${t('attHoursLbl')}: <b class="mono" style="color:${att?(attStatus==='present'?'inherit':((ATTENDANCE_STATUSES[attStatus]||{}).color||'inherit')):'var(--muted)'}">${att ? (attStatus==='present'?fmt(attHours):attendanceStatusLabel(attStatus)) : t('noAttendanceForDate')}</b></span>
              <span>${t('distributedHoursLbl')}: <b class="mono">${fmt(distributed)}</b></span>
              ${att ? `<span style="color:${dayHeaderColor};font-weight:700;">${hasMismatch ? '⚠️ '+t('dailyMismatchWarning') : '✓'}</span>` : ''}
            </div>
          </td>
        </tr>
        ${dayEntries.map(e=>`
        <tr>
          <td style="width:24px;"></td>
          <td><span style="color:${ENTRY_TYPES[e.type].color}">${entryLabel(e.type)}</span></td>
          <td>${e.type==='project' ? (state.projects.find(p=>p.id===e.projectId)?.name || '—') : '—'}</td>
          <td>${e.task ? e.task : '—'}</td>
          <td class="mono">${e.hours}</td>
          <td>${locLabel(e.location)}</td>
          <td>${e.approved ? `<span style="color:var(--green)">● ${t('entryApprovedBadge')}</span>` : `<span style="color:var(--amber)">● ${t('entryPendingBadge')}</span>`}</td>
        </tr>
        <tr>
          <td></td>
          <td colspan="6" style="padding-bottom:8px;">${locked ? '' : `<button class="btn btn-sm ${e.approved?'':'btn-solid'}" data-entry-toggle="${e.id}" data-approved="${e.approved?'1':'0'}">${e.approved ? t('revokeEntryBtn') : t('approveEntryBtn')}</button>`}</td>
        </tr>`).join('') || `<tr><td></td><td colspan="6"><div class="empty-state" style="padding:6px 0;">${t('noEntriesYet')}</div></td></tr>`}
      `;
    }).join('') || `<tr><td colspan="7"><div class="empty-state">${t('noEntriesForEmpMonth')}</div></td></tr>`);
    tbl.querySelectorAll('button[data-entry-toggle]').forEach(btn=>{
      btn.onclick = async ()=>{
        const entryId = btn.getAttribute('data-entry-toggle');
        const wasApproved = btn.getAttribute('data-approved')==='1';
        await setEntryApproval(emp.id, month, entryId, !wasApproved, approverName);
        toast(wasApproved ? t('entryRevokedToast') : t('entryApprovedToast'));
        await drawEntries();
      };
    });
  }
}

/* Flexible attendance-sheet parser: matches employee code/name and either a ready
   "Hours" column, or Date + Check-in + Check-out columns, and sums hours per
   employee within the given fiscal month period. Returns { [employeeCode]: totalHours } */
function parseMonthlyDataRows(rows){
  // Flexible column matching (any order): Code/Name to identify the employee, plus
  // Target / Approved Hours / Annual / Unpaid / Holiday / Sick — any subset can be present.
  if(!rows || !rows.length) return {};
  const sampleKeys = Object.keys(rows[0]);
  const findKey = (patterns)=> sampleKeys.find(k=> patterns.some(p=> k.toString().toLowerCase().includes(p)));
  const codeKey = findKey(['code','كود']);
  const nameKey = findKey(['name','اسم']);
  const targetKey = findKey(['target','مستهدف']);
  const approvedKey = findKey(['approved','معتمد']);
  const annualKey = findKey(['annual']);
  const unpaidKey = findKey(['unpaid']);
  const holidayKey = findKey(['holiday']);
  const sickKey = findKey(['sick']);

  const empByCode = {}; state.employees.forEach(e=>{ if(e.code) empByCode[String(e.code).trim().toLowerCase()] = e; });
  const empByName = {}; state.employees.forEach(e=>{ empByName[String(e.name).trim().toLowerCase()] = e; });
  const resolveEmp = (row)=>{
    if(codeKey && row[codeKey]!==undefined && row[codeKey]!==''){
      const emp = empByCode[String(row[codeKey]).trim().toLowerCase()];
      if(emp) return emp;
    }
    if(nameKey && row[nameKey]){
      const emp = empByName[String(row[nameKey]).trim().toLowerCase()];
      if(emp) return emp;
    }
    return null;
  };
  const toNum = (v)=>{ if(v===undefined || v===null || v==='') return undefined; const n = Number(v); return isFinite(n) ? n : undefined; };

  const out = {};
  for(const row of rows){
    const emp = resolveEmp(row);
    if(!emp) continue;
    out[emp.id] = {
      target: targetKey ? toNum(row[targetKey]) : undefined,
      approved: approvedKey ? toNum(row[approvedKey]) : undefined,
      annual: annualKey ? toNum(row[annualKey]) : undefined,
      unpaid: unpaidKey ? toNum(row[unpaidKey]) : undefined,
      holiday: holidayKey ? toNum(row[holidayKey]) : undefined,
      sick: sickKey ? toNum(row[sickKey]) : undefined,
    };
  }
  return out;
}

function parseAttendanceRows(rows, monthValue){
  if(!rows || !rows.length) return {};
  const sampleKeys = Object.keys(rows[0]);
  const findKey = (patterns)=> sampleKeys.find(k=> patterns.some(p=> k.toString().toLowerCase().includes(p)));
  const codeKey = findKey(['code','كود']);
  const nameKey = findKey(['name','اسم']);
  const hoursKey = findKey(['hours','ساعات','ساعة']);
  const dateKey = findKey(['date','تاريخ']);
  const inKey = findKey(['check in','checkin','in time','time in','حضور']);
  const outKey = findKey(['check out','checkout','out time','time out','انصراف']);

  const empByCode = {}; state.employees.forEach(e=>{ if(e.code) empByCode[String(e.code).trim().toLowerCase()] = e; });
  const empByName = {}; state.employees.forEach(e=>{ empByName[String(e.name).trim().toLowerCase()] = e; });

  const totals = {};
  const addHours = (emp, hours)=>{
    if(!emp || !isFinite(hours) || hours<=0) return;
    totals[emp.code || emp.id] = (totals[emp.code || emp.id] || 0) + hours;
  };
  const resolveEmp = (row)=>{
    if(codeKey && row[codeKey]!==undefined && row[codeKey]!=='') {
      const emp = empByCode[String(row[codeKey]).trim().toLowerCase()];
      if(emp) return emp;
    }
    if(nameKey && row[nameKey]){
      const emp = empByName[String(row[nameKey]).trim().toLowerCase()];
      if(emp) return emp;
    }
    return null;
  };
  const toDate = (v)=>{
    if(v instanceof Date) return v;
    if(typeof v==='number') return new Date(Math.round((v-25569)*86400*1000));
    const d = new Date(v); return isNaN(d) ? null : d;
  };
  const toHoursDiff = (a,b)=>{
    const da=toDate(a), db=toDate(b);
    if(!da||!db) return 0;
    const diff = (db-da)/3600000;
    return diff>0 && diff<24 ? diff : 0;
  };

  for(const row of rows){
    const emp = resolveEmp(row);
    if(!emp) continue;
    const rowDate = dateKey ? toDate(row[dateKey]) : null;
    if(rowDate && !dateInFiscalRange(rowDate, monthValue)) continue;
    if(hoursKey && row[hoursKey]!==''){
      addHours(emp, Number(row[hoursKey])||0);
    } else if(inKey && outKey){
      addHours(emp, toHoursDiff(row[inKey], row[outKey]));
    }
  }
  return totals;
}

/* ============================= CHAT WIDGET (floating, bottom-right, persistent) ============================= */
let _chatPollTimer = null;
let _chatBadgeTimer = null;
let _presenceTimer = null;
let _chatState = {open:false, mode:'contacts', activePartnerId:null, adminViewingKey:null};

function ensureChatWidget(){
  updateMyPresence();
  if(_presenceTimer) clearInterval(_presenceTimer);
  _presenceTimer = setInterval(updateMyPresence, 25000);
  if(document.getElementById('chat-widget-root')) { refreshChatBadge(); return; }
  const root = document.createElement('div');
  root.id = 'chat-widget-root';
  root.innerHTML = `
    <button class="chat-fab" id="chat-fab" title="${t('chatTitle')}">💬<span class="chat-fab-badge" id="chat-fab-badge" style="display:none;">0</span></button>
    <div class="chat-panel" id="chat-panel" style="display:none;" ${state.lang==='ar'?'dir-ar':''}></div>
  `;
  document.body.appendChild(root);
  document.getElementById('chat-fab').onclick = toggleChatPanel;
  refreshChatBadge();
  if(_chatBadgeTimer) clearInterval(_chatBadgeTimer);
  _chatBadgeTimer = setInterval(refreshChatBadge, 20000); // keep the unread badge fresh even while panel is closed
}
function removeChatWidget(){
  const root = document.getElementById('chat-widget-root');
  if(root) root.remove();
  if(_chatPollTimer){ clearInterval(_chatPollTimer); _chatPollTimer=null; }
  if(_chatBadgeTimer){ clearInterval(_chatBadgeTimer); _chatBadgeTimer=null; }
  if(_presenceTimer){ clearInterval(_presenceTimer); _presenceTimer=null; }
  _chatState = {open:false, mode:'contacts', activePartnerId:null, adminViewingKey:null};
}
async function refreshChatBadge(){
  const badge = document.getElementById('chat-fab-badge');
  if(!badge || !state.currentUser) return;
  const count = await totalUnreadChatCount(state.currentUser.id);
  if(count>0){ badge.style.display=''; badge.textContent = count>99?'99+':String(count); }
  else{ badge.style.display='none'; }
}
function toggleChatPanel(){
  const panel = document.getElementById('chat-panel');
  _chatState.open = !_chatState.open;
  panel.style.display = _chatState.open ? 'flex' : 'none';
  panel.style.flexDirection = 'column';
  if(_chatState.open){
    _chatState.mode = 'contacts'; _chatState.activePartnerId = null; _chatState.adminViewingKey = null;
    drawChatPanel();
    if(_chatPollTimer) clearInterval(_chatPollTimer);
    _chatPollTimer = setInterval(()=>{
      if(!_chatState.open) return;
      if(_chatState.mode==='contacts') refreshContactPresenceDots();
      else drawChatPanel(true);
    }, 4000);
  } else if(_chatPollTimer){ clearInterval(_chatPollTimer); _chatPollTimer=null; }
}
async function drawChatPanel(silentRefresh){
  const panel = document.getElementById('chat-panel');
  if(!panel) return;
  const user = state.currentUser;
  const hasFullAccess = user.role==='admin' || user.role==='gm';

  if(_chatState.mode==='thread' && _chatState.activePartnerId){
    if(!silentRefresh) await renderChatThreadShell(panel, hasFullAccess);
    await refreshChatThreadMessages();
    return;
  }
  if(_chatState.mode==='admin-thread' && _chatState.adminViewingKey){
    if(!silentRefresh) await renderChatAdminThread(panel);
    return;
  }
  if(silentRefresh) return; // contact/admin lists don't need silent polling refresh
  if(_chatState.mode==='admin-list'){ await renderChatAdminList(panel, hasFullAccess); return; }
  await renderChatContactList(panel, hasFullAccess);
}

  return `

      <div class="chat-tab ${activeMode==='contacts'?'active':''}" id="chat-tab-mine">${t('chatMyChatsTab')}</div>
      <div class="chat-tab ${activeMode==='admin-list'?'active':''}" id="chat-tab-all">${t('chatAllChatsTab')}</div>
    </div>`;
}
function wireChatTabs(hasFullAccess){
  if(!hasFullAccess) return;
  const t1 = document.getElementById('chat-tab-mine'), t2 = document.getElementById('chat-tab-all');
  if(t1) t1.onclick = ()=>{ _chatState.mode='contacts'; drawChatPanel(); };
  if(t2) t2.onclick = ()=>{ _chatState.mode='admin-list'; drawChatPanel(); };
}

// Who a given user is allowed to see/chat with in the contacts list:
// - manager / gm / admin: everyone in the company
// - full-time employees: other full-time employees only (their manager is naturally included, since managers are full-time)
// - part-time employees: their direct manager only
function getChatVisibleColleagues(user){
  const others = state.employees.filter(e=>e.id!==user.id && !e.resignDate);
  const canSeeEveryone = user.role==='manager' || user.role==='gm' || user.role==='admin';
  if(canSeeEveryone) return others;
  if(user.status==='active_parttime'){
    return others.filter(e=>e.id===user.managerId);
  }
  return others.filter(e=>e.status==='active_fulltime');
}

async function refreshContactPresenceDots(){
  const listEl = document.getElementById('chat-contact-list');
  if(!listEl) return;
  const ids = [...listEl.querySelectorAll('.chat-contact')].map(el=>el.dataset.id);
  if(!ids.length) return;
  const presenceMap = await loadPresenceMap(ids);
  ids.forEach(id=>{
    const row = listEl.querySelector(`.chat-contact[data-id="${id}"]`);
    if(!row) return;
    const avatar = row.querySelector('.avatar-wrap');
    if(!avatar) return;
    let dot = avatar.querySelector('.avatar-dot');
    const online = isOnline(presenceMap[id]);
    if(!dot){ dot = document.createElement('span'); dot.className='avatar-dot'; avatar.appendChild(dot); }
    dot.className = 'avatar-dot ' + (online ? 'online' : 'offline');
  });
}

async function renderChatContactList(panel, hasFullAccess){
  const user = state.currentUser;
  const idx = await loadChatIndex(user.id);
  const colleagues = getChatVisibleColleagues(user);
  const presenceMap = await loadPresenceMap(colleagues.map(e=>e.id));
  const rows = colleagues.map(e=>({
    id:e.id, name:e.name, photo:e.photo, online:isOnline(presenceMap[e.id]),
    lastMessage: idx[e.id] ? idx[e.id].lastMessage : '',
    lastMessageAt: idx[e.id] ? idx[e.id].lastMessageAt : null,
    unread: idx[e.id] ? (idx[e.id].unread||0) : 0,
  })).sort((a,b)=>{
    if(a.lastMessageAt && b.lastMessageAt) return b.lastMessageAt.localeCompare(a.lastMessageAt);
    if(a.lastMessageAt) return -1;
    if(b.lastMessageAt) return 1;
    return a.name.localeCompare(b.name);
  });

  panel.innerHTML = `
    <div class="chat-header"><span class="chat-header-title">${t('chatTitle')}</span><button id="chat-close">✕</button></div>
    ${chatTabsHTML(hasFullAccess, 'contacts')}
    <div class="chat-search"><input type="text" id="chat-search-input" placeholder="${t('chatSearchPh')}"/></div>
    <div class="chat-contact-list" id="chat-contact-list"></div>
  `;
  document.getElementById('chat-close').onclick = toggleChatPanel;
  wireChatTabs(hasFullAccess);

  function drawRows(filterText){
    const listEl = document.getElementById('chat-contact-list');
    const filtered = !filterText ? rows : rows.filter(r=>r.name.toLowerCase().includes(filterText.toLowerCase()));
    listEl.innerHTML = filtered.map(r=>`
      <div class="chat-contact" data-id="${r.id}">
        ${empAvatarHTML(r, 34, r.online)}
        <div class="chat-contact-info">
          <div class="chat-contact-name">${r.name}</div>
          <div class="chat-contact-preview">${r.lastMessage || ''}</div>
        </div>
        ${r.unread>0 ? `<div class="chat-contact-unread">${r.unread>9?'9+':r.unread}</div>` : ''}
      </div>`).join('') || `<div class="empty-state" style="padding:20px;">${t('chatNoContacts')}</div>`;
    listEl.querySelectorAll('.chat-contact').forEach(el=>{
      el.onclick = ()=>{ _chatState.mode='thread'; _chatState.activePartnerId = el.dataset.id; drawChatPanel(); };
    });
  }
  drawRows('');
  document.getElementById('chat-search-input').oninput = (e)=>drawRows(e.target.value);
}

async function renderChatThreadShell(panel, hasFullAccess){
  const partner = state.employees.find(e=>e.id===_chatState.activePartnerId);
  const presenceMap = partner ? await loadPresenceMap([partner.id]) : {};
  const online = partner ? isOnline(presenceMap[partner.id]) : false;
  panel.innerHTML = `
    <div class="chat-header">
      <button id="chat-back">←</button>
      ${partner ? empAvatarHTML(partner, 26, online) : ''}
      <span class="chat-header-title">${partner ? partner.name : ''}</span>
      <button id="chat-close">✕</button>
    </div>
    <div class="chat-thread" id="chat-thread-body"></div>
    <div class="chat-input-row">
      <input type="text" id="chat-msg-input" placeholder="${t('chatTypeMsgPh')}" autocomplete="off"/>
      <button id="chat-send-btn">➤</button>
    </div>
  `;
  document.getElementById('chat-close').onclick = toggleChatPanel;
  document.getElementById('chat-back').onclick = ()=>{ _chatState.mode='contacts'; _chatState.activePartnerId=null; drawChatPanel(); };
  const input = document.getElementById('chat-msg-input');
  const send = async ()=>{
    const text = input.value.trim();
    if(!text) return;
    input.value='';
    await sendChatMessageTo(state.currentUser.id, state.currentUser.name, partner.id, partner.name, text);
    await refreshChatThreadMessages();
    refreshChatBadge();
  };
  document.getElementById('chat-send-btn').onclick = send;
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') send(); });
}
async function refreshChatThreadMessages(){
  const body = document.getElementById('chat-thread-body');
  if(!body) return;
  const user = state.currentUser;
  const partnerId = _chatState.activePartnerId;
  const messages = await loadChatThread(user.id, partnerId);
  const wasNearBottom = (body.scrollHeight - body.scrollTop - body.clientHeight) < 60;
  body.innerHTML = messages.length ? messages.map(m=>`
    <div class="chat-bubble-row ${m.senderId===user.id?'mine':''}">
      <div class="chat-bubble">${escapeHtml(m.text)}<span class="chat-bubble-time">${chatTimeLabel(m.at)}</span></div>
    </div>`).join('') : `<div class="empty-state" style="padding:20px;">${t('chatNoMessagesYet')}</div>`;
  if(wasNearBottom) body.scrollTop = body.scrollHeight;
  await markChatThreadRead(user.id, partnerId);
  refreshChatBadge();
}
function chatTimeLabel(iso){
  try{
    const d = new Date(iso);
    return d.toLocaleString(state.lang==='en'?'en-US':'ar-EG', {hour:'2-digit', minute:'2-digit', day:'2-digit', month:'2-digit'});
  }catch(e){ return ''; }
}
function escapeHtml(s){
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

// ---- Admin/GM oversight: read-only view of every conversation company-wide ----
async function renderChatAdminList(panel, hasFullAccess){
  panel.innerHTML = `
    <div class="chat-header"><span class="chat-header-title">${t('chatTitle')}</span><button id="chat-close">✕</button></div>
    ${chatTabsHTML(hasFullAccess, 'admin-list')}
    <div class="chat-contact-list" id="chat-admin-list"><div class="empty-state" style="padding:20px;">${t('loading')}</div></div>
  `;
  document.getElementById('chat-close').onclick = toggleChatPanel;
  wireChatTabs(hasFullAccess);
  const conversations = await loadAllChatConversations();
  const empById = {}; state.employees.forEach(e=>empById[e.id]=e);
  conversations.sort((a,b)=>{
    const at = a.messages[a.messages.length-1].at, bt = b.messages[b.messages.length-1].at;
    return bt.localeCompare(at);
  });
  const listEl = document.getElementById('chat-admin-list');
  listEl.innerHTML = conversations.map(c=>{
    const names = c.participantIds.map(id=> (empById[id]?empById[id].name:id) );
    const last = c.messages[c.messages.length-1];
    return `
      <div class="chat-contact" data-key="${c.key}">
        <div class="chat-avatar">👁</div>
        <div class="chat-contact-info">
          <div class="chat-contact-name">${names.join(' ↔ ')}</div>
          <div class="chat-contact-preview">${escapeHtml((last.senderName||'')+': '+last.text)}</div>
        </div>
      </div>`;
  }).join('') || `<div class="empty-state" style="padding:20px;">${t('chatNoConversations')}</div>`;
  listEl.querySelectorAll('.chat-contact').forEach(el=>{
    el.onclick = ()=>{ _chatState.mode='admin-thread'; _chatState.adminViewingKey = el.dataset.key; drawChatPanel(); };
  });
}
async function renderChatAdminThread(panel){
  const key = _chatState.adminViewingKey;
  const ids = key.slice('chat:'.length).split('__');
  const empById = {}; state.employees.forEach(e=>empById[e.id]=e);
  const names = ids.map(id=> (empById[id]?empById[id].name:id) );
  const messages = await loadJSON(key, true, []);
  panel.innerHTML = `
    <div class="chat-header">
      <button id="chat-back">←</button>
      <span class="chat-header-title">${names.join(' ↔ ')}</span>
      <button id="chat-close">✕</button>
    </div>
    <div class="chat-thread" id="chat-thread-body">
      ${messages.map(m=>`
        <div class="chat-bubble-row ${m.senderId===ids[0]?'mine':''}">
          <div class="chat-bubble">${escapeHtml(m.senderName)}: ${escapeHtml(m.text)}<span class="chat-bubble-time">${chatTimeLabel(m.at)}</span></div>
        </div>`).join('') || `<div class="empty-state" style="padding:20px;">${t('chatNoMessagesYet')}</div>`}
    </div>
    <div class="chat-viewonly-note">${t('chatViewOnlyNote')}</div>
  `;
  document.getElementById('chat-close').onclick = toggleChatPanel;
  document.getElementById('chat-back').onclick = ()=>{ _chatState.mode='admin-list'; _chatState.adminViewingKey=null; drawChatPanel(); };
  const body = document.getElementById('chat-thread-body');
  body.scrollTop = body.scrollHeight;
}

bootstrap();
