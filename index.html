<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Wenmore | نظام إدارة الطاقة الاستيعابية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#EFF5FB;
    --panel:#FFFFFF;
    --panel2:#F3F8FD;
    --line:#D7E4F2;
    --line-soft:#E6EFF9;
    --text:#122347;
    --muted:#6E85A6;
    --cyan:#2F7FD4;
    --navy:#1B2A6B;
    --amber:#C98A2E;
    --green:#2FA36B;
    --rose:#D65C73;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;}
  #app{min-height:100vh;position:relative;}
  #app::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:
      linear-gradient(var(--line-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
    background-size:32px 32px;
    opacity:.6;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}

  /* ---- login ---- */
  .login-wrap{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .login-card{width:380px;max-width:100%;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:32px;position:relative;box-shadow:0 12px 34px rgba(18,35,71,.10);}
  .login-card::before,.login-card::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--cyan);opacity:.7;}
  .login-card::before{top:-1px;right:-1px;border-left:none;border-bottom:none;}
  .login-card::after{bottom:-1px;left:-1px;border-right:none;border-top:none;}
  .logo-wrap{display:flex;justify-content:center;margin-bottom:18px;}
  .logo-wrap img{height:78px;width:auto;}
  .brand-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.15em;color:var(--cyan);text-transform:uppercase;margin-bottom:6px;text-align:center;}
  .brand-title{font-size:19px;font-weight:700;margin:0 0 24px;line-height:1.5;text-align:center;color:var(--navy);}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;}
  .field input,.field select{width:100%;padding:10px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:3px;color:var(--text);font-size:14px;}
  .field input:focus,.field select:focus{outline:none;border-color:var(--cyan);}
  .btn{padding:10px 18px;border-radius:3px;border:1px solid var(--cyan);background:transparent;color:var(--cyan);font-size:14px;font-weight:600;transition:.15s;}
  .btn:hover{background:rgba(47,127,212,.08);}
  .btn-solid{background:var(--cyan);color:#FFFFFF;border:1px solid var(--cyan);}
  .btn-solid:hover{opacity:.88;background:var(--cyan);}
  .btn-full{width:100%;}
  .btn-danger{border-color:var(--rose);color:var(--rose);}
  .btn-danger:hover{background:rgba(214,92,115,.08);}
  .btn-sm{padding:5px 10px;font-size:12px;}
  .err{color:var(--rose);font-size:12px;margin-top:10px;min-height:16px;}
  .login-footer{margin-top:18px;text-align:center;font-size:11.5px;color:var(--muted);line-height:1.8;border-top:1px solid var(--line-soft);padding-top:14px;}

  /* ---- shell ---- */
  .topbar{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;padding:12px 24px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.85);backdrop-filter:blur(6px);}
  .topbar-left{display:flex;align-items:center;gap:12px;}
  .topbar-title{font-weight:700;font-size:15px;}
  .topbar-title .mono{color:var(--cyan);font-size:11px;display:block;letter-spacing:.1em;}
  .topbar-right{display:flex;align-items:center;gap:14px;font-size:13px;color:var(--muted);}
  .badge{display:inline-block;padding:2px 8px;border-radius:2px;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.05em;}
  .shell{position:relative;z-index:1;display:flex;min-height:calc(100vh - 57px);}
  .sidebar{width:190px;border-left:1px solid var(--line);padding:18px 10px;flex-shrink:0;}
  .nav-item{display:block;width:100%;text-align:right;padding:10px 12px;margin-bottom:4px;border-radius:3px;background:transparent;border:none;color:var(--muted);font-size:13.5px;font-weight:500;}
  .nav-item:hover{background:var(--line-soft);color:var(--text);}
  .nav-item.active{background:var(--panel2);color:var(--cyan);border-right:2px solid var(--cyan);}
  .main{flex:1;padding:22px 26px;overflow-x:auto;}
  h2.page-title{font-size:19px;margin:0 0 4px;}
  .page-sub{color:var(--muted);font-size:12.5px;margin:0 0 20px;}

  /* ---- cards / grid ---- */
  .cards-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px;}
  .stat-card{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px 16px;box-shadow:0 1px 3px rgba(18,35,71,.05);}
  .stat-card .lbl{font-size:11px;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em;}
  .stat-card .val{font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:600;color:var(--navy);}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:18px;margin-bottom:18px;box-shadow:0 1px 3px rgba(18,35,71,.05);}
  .panel-title{font-size:14px;font-weight:700;margin:0 0 14px;display:flex;align-items:center;justify-content:space-between;}
  .filters-row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px;}
  .filters-row select,.filters-row input{padding:8px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:3px;color:var(--text);font-size:12.5px;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{text-align:right;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);font-size:11px;text-transform:uppercase;letter-spacing:.03em;}
  td{padding:9px 10px;border-bottom:1px solid var(--line-soft);}
  tr:hover td{background:rgba(47,127,212,.04);}
  .util-bar-wrap{width:90px;height:6px;background:var(--line-soft);border-radius:3px;overflow:hidden;display:inline-block;vertical-align:middle;margin-left:8px;}
  .util-bar-fill{height:100%;border-radius:3px;}
  .util-table-wrap{overflow-x:auto;}
  .util-emp-table{width:auto;min-width:100%;white-space:nowrap;}
  .util-emp-table th, .util-emp-table td{text-align:center;padding:6px 8px;border:1px solid var(--line-soft);font-size:11.5px;}
  .util-emp-table thead th{background:var(--navy);color:#fff;text-transform:none;font-size:11px;}
  .util-emp-table thead tr:first-child th{background:var(--navy);}
  .util-emp-table th.grp-approved{background:#1B2A6B;color:#fff;}
  .util-emp-table th.grp-dist{background:#2F7FD4;color:#fff;}
  .util-emp-table th.grp-util{background:#C98A2E;color:#fff;}
  .util-emp-table th.grp-note{background:#2FA36B;color:#fff;}
  .util-emp-table th.grp-cost{background:#6E85A6;color:#fff;}
  .util-emp-table td.grp-cost{background:rgba(110,133,166,.08);}
  .util-emp-table td.grp-approved{background:rgba(27,42,107,.05);}
  .util-emp-table td.grp-dist{background:rgba(47,127,212,.05);}
  .util-emp-table td.grp-note{background:rgba(47,163,107,.05);}
  .util-emp-table input[type="number"]{padding:5px 6px;background:var(--panel2);border:1px solid var(--line);border-radius:3px;color:var(--text);font-size:11.5px;text-align:center;}
  .util-emp-table input[type="number"]:focus{outline:none;border-color:var(--cyan);}
  .chart-box{position:relative;height:260px;}
  .grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;}
  .grid2b{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  @media(max-width:900px){.grid2,.grid2b{grid-template-columns:1fr;}}
  .modal-backdrop{position:fixed;inset:0;background:rgba(18,35,71,.35);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:22px;width:420px;max-width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 8px 28px rgba(18,35,71,.18);}
  .modal h3{margin:0 0 16px;font-size:15px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .icon-btn{background:transparent;border:none;color:var(--muted);font-size:14px;padding:4px 6px;}
  .icon-btn:hover{color:var(--cyan);}
  .empty-state{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--cyan);color:var(--text);padding:10px 20px;border-radius:4px;font-size:13px;z-index:100;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}

  /* ---- language switch ---- */
  .lang-switch{display:flex;gap:6px;justify-content:center;margin-bottom:16px;}
  .lang-btn{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);font-size:12px;font-weight:600;}
  .lang-btn .flag{font-size:16px;line-height:1;}
  .lang-btn.active{border-color:var(--cyan);color:var(--cyan);background:rgba(47,127,212,.08);}
  .lang-switch-top{display:flex;gap:4px;align-items:center;}
  .lang-btn-sm{padding:4px 8px;border-radius:16px;border:1px solid var(--line);background:var(--panel2);font-size:15px;line-height:1;}
  .lang-btn-sm.active{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan) inset;}

  /* ---- LTR (English) overrides ---- */
  html[dir="ltr"] .sidebar{border-left:none;border-right:1px solid var(--line);}
  html[dir="ltr"] .nav-item{text-align:left;}
  html[dir="ltr"] .nav-item.active{border-right:none;border-left:2px solid var(--cyan);}
  html[dir="ltr"] th{text-align:left;}
  html[dir="ltr"] .login-card::before{right:auto;left:-1px;border-left:2px solid var(--cyan);border-right:none;}
  html[dir="ltr"] .login-card::after{left:auto;right:-1px;border-right:2px solid var(--cyan);border-left:none;}
  html[dir="ltr"] .util-bar-wrap{margin-left:0;margin-right:8px;}
</style>
</head>

<script>
/* ============================= SUPABASE CLOUD STORAGE ============================= */
const SUPABASE_URL = 'https://btvjuornfvzdtawcnjlr.supabase.co';
const SUPABASE_KEY = 'sb_publishable_5dNoMeKPetjoeMbHXfFUTA_mq7Z1Evm';

const _sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function _fullKey(key, shared){ return (shared ? 'shared::' : 'local::') + key; }

window.storage = {
  async get(key, shared){
    const { data, error } = await _sb
      .from('kv_store')
      .select('value')
      .eq('key', _fullKey(key, shared))
      .maybeSingle();
    if(error || !data) return null;
    return { value: data.value };
  },
  async set(key, value, shared){
    const { error } = await _sb
      .from('kv_store')
      .upsert({ key: _fullKey(key, shared), value: value, updated_at: new Date().toISOString() });
    if(error){ console.error('supabase set error', error); return null; }
    return { key, value, shared };
  },
  async delete(key, shared){
    const { error } = await _sb
      .from('kv_store')
      .delete()
      .eq('key', _fullKey(key, shared));
    if(error){ console.error('supabase delete error', error); return null; }
    return { key, deleted: true, shared };
  },
  async list(prefix, shared){
    const full = _fullKey(prefix || '', shared);
    const { data, error } = await _sb
      .from('kv_store')
      .select('key')
      .like('key', full + '%');
    if(error){ console.error('supabase list error', error); return { keys: [] }; }
    const stripLen = (shared ? 'shared::' : 'local::').length;
    return { keys: data.map(r => r.key.slice(stripLen)) };
  }
};
</script>

function uid(prefix){return prefix+'_'+Math.random().toString(36).slice(2,9);}
function deptOf(id){return DEPARTMENTS.find(d=>d.id===id) || {name_ar:id,name_en:id,color:'#888'};}
function deptName(id){ const d=deptOf(id); return state.lang==='en' ? d.name_en : d.name_ar; }
function roleOf(id){ return ROLES.find(r=>r.id===id) || ROLES[0]; }
function roleLabel(id){ const r=roleOf(id); return state.lang==='en' ? r.label_en : r.label_ar; }
function isManagerRole(role){ return role==='manager' || role==='gm' || role==='admin'; }
function managerName(e){ if(!e.managerId) return '—'; const m=state.employees.find(x=>x.id===e.managerId); return m ? m.name : '—'; }
function empStatusOf(id){ return EMP_STATUSES.find(s=>s.id===id) || EMP_STATUSES[2]; }
function empStatusLabel(id){ const s=empStatusOf(id); return state.lang==='en' ? s.label_en : s.label_ar; }
function empStatusBadge(id){ const s=empStatusOf(id); return `<span style="color:${s.color}">● ${empStatusLabel(id)}</span>`; }
function isEmpActiveStatus(status){ return status==='active_fulltime' || status==='active_parttime'; }
function empRate(e){ return Number(e && e.rate) || 0; }
function empRateHistory(e){ return (e && Array.isArray(e.rateHistory)) ? e.rateHistory : []; }
function toDateStr(d){ const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; }
/* Returns the hourly rate effective for a given employee on a given date ('YYYY-MM-DD'),
   taking into account any rate-change entries logged on emp.rateHistory. An employee's rate
   can be changed as many times as needed (including several times within the same month) —
   each change applies from its effective date onward, until the next change (if any). */
function rateAt(emp, dateStr){
  if(!emp) return 0;
  const hist = empRateHistory(emp).filter(r=>r && r.date && r.date<=dateStr).sort((a,b)=> a.date<b.date?-1:(a.date>b.date?1:0));
  if(hist.length) return Number(hist[hist.length-1].rate)||0;
  return empRate(emp);
}
function migrateEmployee(e){
  if(!e.role) e.role='engineer';
  if(e.managerId===undefined) e.managerId=null;
  if(e.hireDate===undefined) e.hireDate=null;
  if(e.resignDate===undefined) e.resignDate=null;
  if(e.rate===undefined || e.rate===null || isNaN(Number(e.rate))) e.rate=0;
  if(!Array.isArray(e.rateHistory)) e.rateHistory=[];
  if(!e.status || e.status==='active'){
    e.status = e.empType==='parttime' ? 'active_parttime' : 'active_fulltime';
  } else if(e.status==='resigned'){
    e.status = 'inactive';
  }
  return e;
}
function approvalStatusBadge(status){
  if(status==='gm_approved') return `<span style="color:var(--green)">● ${t('apprGmApproved')}</span>`;
  if(status==='manager_approved') return `<span style="color:var(--cyan)">● ${t('apprManagerApproved')}</span>`;
  return `<span style="color:var(--amber)">● ${t('apprPending')}</span>`;
}
function entryLabel(type){ const e=ENTRY_TYPES[type]; return state.lang==='en' ? e.label_en : e.label_ar; }
function monthLabel(v){ const m=MONTHS.find(x=>x[0]===v); if(!m) return v; return state.lang==='en' ? m[2] : m[1]; }
function locLabel(loc){ return t(loc==='onsite' ? 'onsite' : 'remote'); }
function fmt(n){return (Math.round(n*10)/10).toLocaleString('en-US');}
function utilColor(pct){ if(pct>=85) return getVar('--green'); if(pct>=60) return getVar('--amber'); return getVar('--rose'); }
function getVar(name){return getComputedStyle(document.documentElement).getPropertyValue(name).trim();}

/* ============================= STORAGE HELPERS ============================= */
/* Uses window.storage when running inside Claude's environment; falls back to
   the browser's localStorage when the file is opened/downloaded and run standalone. */
const HAS_CLOUD_STORAGE = (typeof window !== 'undefined' && !!window.storage);
const LS_PREFIX = 'wenmore-utilization::';
function lsKey(key, shared){ return LS_PREFIX + (shared ? 'shared' : 'local') + '::' + key; }

async function loadJSON(key, shared, fallback){
  if(HAS_CLOUD_STORAGE){
    try{
      const r = await window.storage.get(key, shared);
      return r ? JSON.parse(r.value) : fallback;
    }catch(e){ /* fall through to localStorage */ }
  }
  try{
    const raw = localStorage.getItem(lsKey(key, shared));
    return raw !== null ? JSON.parse(raw) : fallback;
  }catch(e){ return fallback; }
}
async function saveJSON(key, shared, value){
  if(HAS_CLOUD_STORAGE){
    try{ await window.storage.set(key, JSON.stringify(value), shared); return; }catch(e){ /* fall through */ }
  }
  try{ localStorage.setItem(lsKey(key, shared), JSON.stringify(value)); }catch(e){ console.error('save failed', key, e); }
}
async function deleteKey(key, shared){
  if(HAS_CLOUD_STORAGE){
    try{ await window.storage.delete(key, shared); return; }catch(e){ /* fall through */ }
  }
  try{ localStorage.removeItem(lsKey(key, shared)); }catch(e){}
}
async function listKeys(prefix, shared){
  if(HAS_CLOUD_STORAGE){
    try{ const r = await window.storage.list(prefix, shared); return r ? r.keys : []; }catch(e){ /* fall through */ }
  }
  try{
    const full = lsKey(prefix, shared);
    const out = [];
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.indexOf(full)===0){ out.push(k.slice(LS_PREFIX.length + (shared?'shared':'local').length + 2)); }
    }
    return out;
  }catch(e){ return []; }
}

function attendanceHoursDiff(inStr, outStr){
  if(!inStr || !outStr) return 0;
  const [ih,im] = inStr.split(':').map(Number);
  const [oh,om] = outStr.split(':').map(Number);
  if(!isFinite(ih)||!isFinite(im)||!isFinite(oh)||!isFinite(om)) return 0;
  const diff = ((oh*60+om) - (ih*60+im)) / 60;
  return diff>0 && diff<24 ? Math.round(diff*100)/100 : 0;
}
function monthOfDateStr(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  if(!y||!m||!d) return null;
  const dt = new Date(y, m-1, d);
  for(const [v] of MONTHS){ if(dateInFiscalRange(dt, v)) return v; }
  return null;
}

  const s = ATTENDANCE_STATUSES[status] || ATTENDANCE_STATUSES.present;
  return state.lang==='en' ? s.label_en : s.label_ar;
}
// Recomputes Approved Hours / Annual / Unpaid / Holiday for an employee+month from their
// recorded attendance days, and saves them so the "Details by Employee" tables stay in sync.
// Sick-leave days are counted together with Unpaid, since there's no separate Sick column.
async function syncAttendanceToMonthlyData(empId, month){
  const days = await loadAttendance(empId, month);
  const statusOf = d => d.status || 'present';
  const approvedHours = days.filter(d=>statusOf(d)==='present').reduce((a,d)=>a+Number(d.hours||0),0);
  const annual = days.filter(d=>statusOf(d)==='annual').length;
  const unpaid = days.filter(d=>statusOf(d)==='unpaid' || statusOf(d)==='sick').length;
  const holiday = days.filter(d=>statusOf(d)==='holiday').length;
  await saveApprovedHours(empId, month, approvedHours);
  await saveNote(empId, month, {annual, unpaid, holiday});
}

function summarizeEntries(entries){
  const sum = {project:0, training:0, tender:0, free:0, total:0, onsite:0, remote:0};
  for(const e of entries){
    sum[e.type] = (sum[e.type]||0) + e.hours;
    sum.total += e.hours;
    if(e.location==='onsite') sum.onsite += e.hours; else sum.remote += e.hours;
  }
  return sum;
}

/* ============================= FISCAL MONTH PERIOD (26th -> 25th) ============================= */
function fiscalRange(monthValue){
  // monthValue: 'YYYY-MM' — e.g. February 2026 runs from 26 Jan 2026 to 25 Feb 2026
  const [y,m] = monthValue.split('-').map(Number);
  const start = new Date(y, m-2, 26); // m-2 => previous month (0-indexed), day 26
  const end = new Date(y, m-1, 25);   // this month, day 25
  return {start, end};
}
function fiscalRangeLabel(monthValue){
  const {start,end} = fiscalRange(monthValue);
  const opts = {day:'numeric', month:'long', year:'numeric'};
  const locale = state.lang==='en' ? 'en-GB' : 'ar-EG';
  try{
    return `${start.toLocaleDateString(locale,opts)} — ${end.toLocaleDateString(locale,opts)}`;
  }catch(e){ return `${start.toDateString()} — ${end.toDateString()}`; }
}
function dateInFiscalRange(d, monthValue){
  const {start,end} = fiscalRange(monthValue);
  return d>=start && d<=end;
}
function monthEndDateStr(monthValue){
  const {end} = fiscalRange(monthValue);
  return toDateStr(end);
}
function employeeActiveInMonth(emp, monthValue){
  // Employees only appear in a month's reports starting from their hire month onward.
  // Employees with no hireDate set are treated as always active (legacy/back-compat).
  if(!emp.hireDate) return true;
  const [hy,hm,hd] = emp.hireDate.split('-').map(Number);
  if(!hy || !hm || !hd) return true;
  const hireD = new Date(hy, hm-1, hd);
  const {end} = fiscalRange(monthValue);
  return hireD <= end;
}
function employeeCountsInMonth(emp, monthValue){
  // Whether the employee's hours/target should be calculated for this month.
  // False once the whole fiscal period falls after their resignation date —
  // the employee still appears in reports (see employeeActiveInMonth), just with no figures counted.
  if(!employeeActiveInMonth(emp, monthValue)) return false;
  if(!emp.resignDate) return true;
  const [ry,rm,rd] = emp.resignDate.split('-').map(Number);
  if(!ry || !rm || !rd) return true;
  const resignD = new Date(ry, rm-1, rd);
  const {start} = fiscalRange(monthValue);
  return start <= resignD;
}
function resignedBadge(emp, monthValue){
  if(!emp.resignDate) return '';
  const counts = monthValue ? employeeCountsInMonth(emp, monthValue) : false;
  if(monthValue && counts) return '';
  return `<span class="badge" style="background:var(--rose)22;color:var(--rose);margin-inline-start:6px;" title="${emp.resignDate}">${t('statusResigned')}</span>`;
}

function doLogin(){
  const u = document.getElementById('login-user').value.trim();
  const p = document.getElementById('login-pass').value;
  const err = document.getElementById('login-err');
  if(u==='admin' && p===state.adminPassword){

    state.route='dashboard';

  }
  const emp = state.employees.find(e=>e.username===u && e.password===p);

  state.currentUser = emp;

}

function openChangePasswordModal(){
  const backdrop = document.createElement('div');

      <div class="err" id="cp-err"></div>
      <div style="display:flex;gap:10px;margin-top:8px;">
        <button class="btn btn-solid" id="cp-save">${t('save')}</button>
        <button class="btn" id="cp-cancel">${t('cancel')}</button>
      </div>
    </div>`;
  document.body.appendChild(backdrop);
  document.getElementById('cp-cancel').onclick = ()=>backdrop.remove();
  document.getElementById('cp-save').onclick = async ()=>{
    const cur = document.getElementById('cp-current').value;
    const next = document.getElementById('cp-new').value;
    const confirmVal = document.getElementById('cp-confirm').value;
    const err = document.getElementById('cp-err');
    const isAdmin = state.currentUser.role==='admin';
    const currentStored = isAdmin ? state.adminPassword : state.currentUser.password;
    if(cur !== currentStored){ err.textContent = t('currentPasswordWrong'); return; }
    if(next.length < 4){ err.textContent = t('passwordTooShort'); return; }
    if(next !== confirmVal){ err.textContent = t('passwordsNoMatch'); return; }
    if(isAdmin){
      state.adminPassword = next;
      await saveJSON('admin-password', false, next);
    } else {
      const idx = state.employees.findIndex(x=>x.id===state.currentUser.id);
      state.employees[idx] = {...state.employees[idx], password: next};
      state.currentUser = state.employees[idx];
      await saveJSON('employees', true, state.employees);
    }
    backdrop.remove();
    toast(t('passwordChanged'));
  };
}

/* Manage an employee's hourly-rate change log. Any number of changes is allowed
   (including several within the same month) — each is saved immediately to the
   employee record, and cost calculations across the app pick up the rate that
   was effective on each timesheet entry's own date. */
function openRateHistoryModal(emp, onChange){
  if(!Array.isArray(emp.rateHistory)) emp.rateHistory=[];
  let editingId = null;
  const backdrop = document.createElement('div');
  backdrop.className='modal-backdrop';
  backdrop.style.zIndex = 60;
  backdrop.innerHTML = `
    <div class="modal" style="width:480px;">
      <h3>${t('rateHistoryTitle')} — ${emp.name}</h3>
      <p style="color:var(--muted);font-size:11.5px;line-height:1.8;margin:-8px 0 14px;">${t('rateHistoryHint')}</p>
      <p style="color:var(--muted);font-size:11.5px;margin:-8px 0 14px;">${t('baseRateNote')}: <span class="mono">${fmt(empRate(emp))}</span></p>
      <div class="util-table-wrap"><table id="rh-table"></table></div>
      <div class="row2" style="margin-top:14px;">
        <div class="field"><label>${t('thEffectiveDate')}</label><input id="rh-date" type="date"/></div>
        <div class="field"><label>${t('thRateVal')}</label><input id="rh-rate" type="number" step="0.01"/></div>
      </div>
      <div style="display:flex;gap:10px;margin-top:4px;">
        <button class="btn btn-solid btn-sm" id="rh-add">${t('addRateChange')}</button>
        <button class="btn btn-sm" id="rh-cancel-edit" style="display:none;">${t('cancel')}</button>
      </div>
      <p style="color:var(--muted);font-size:11px;margin-top:14px;">${t('rateHistorySaveHint')}</p>
      <div style="display:flex;gap:10px;margin-top:8px;">
        <button class="btn" id="rh-close">${t('closeBtn')}</button>
      </div>
    </div>`;
  document.body.appendChild(backdrop);
  document.getElementById('rh-close').onclick = ()=>backdrop.remove();
  document.getElementById('rh-cancel-edit').onclick = ()=>{ editingId=null; resetForm(); renderList(); };
  document.getElementById('rh-add').onclick = async ()=>{
    const date = document.getElementById('rh-date').value;
    const rate = Number(document.getElementById('rh-rate').value);
    if(!date || isNaN(rate) || rate<0){ alert(t('fillDateRate')); return; }
    if(editingId){
      const it = emp.rateHistory.find(r=>r.id===editingId);
      if(it){ it.date=date; it.rate=rate; }
      editingId=null;
    } else {
      emp.rateHistory.push({id:uid('rate'), date, rate});
    }
    const idx = state.employees.findIndex(x=>x.id===emp.id);
    if(idx>=0){ state.employees[idx].rateHistory = emp.rateHistory; await saveJSON('employees', true, state.employees); }
    resetForm();
    renderList();
    onChange && onChange();
    toast(t('savedToast'));
  };
  function resetForm(){
    document.getElementById('rh-date').value='';
    document.getElementById('rh-rate').value='';
    document.getElementById('rh-add').textContent = t('addRateChange');
    document.getElementById('rh-cancel-edit').style.display='none';
  }
  function renderList(){
    const tbl = document.getElementById('rh-table');
    const list = emp.rateHistory.slice().sort((a,b)=> a.date<b.date?1:(a.date>b.date?-1:0));
    tbl.innerHTML = `
      <tr><th>${t('thEffectiveDate')}</th><th>${t('thRateVal')}</th><th></th></tr>
      ${list.map(r=>`
        <tr>
          <td class="mono">${r.date}</td>
          <td class="mono">${fmt(r.rate)}</td>
          <td>
            <button class="icon-btn" data-id="${r.id}" data-a="edit">${t('edit')}</button>
            <button class="icon-btn" data-id="${r.id}" data-a="del" style="color:var(--rose)">${t('del')}</button>
          </td>
        </tr>`).join('') || `<tr><td colspan="3"><div class="empty-state">${t('noRateChanges')}</div></td></tr>`}
    `;
    tbl.querySelectorAll('.icon-btn').forEach(b=>{
      b.onclick = async ()=>{
        const it = emp.rateHistory.find(r=>r.id===b.dataset.id);
        if(!it) return;
        if(b.dataset.a==='edit'){
          editingId = it.id;
          document.getElementById('rh-date').value = it.date;
          document.getElementById('rh-rate').value = it.rate;
          document.getElementById('rh-add').textContent = t('updateRateChange');
          document.getElementById('rh-cancel-edit').style.display='';
        } else {
          if(!confirm(t('confirmDeleteRateChange'))) return;
          emp.rateHistory = emp.rateHistory.filter(r=>r.id!==it.id);
          const idx = state.employees.findIndex(x=>x.id===emp.id);
          if(idx>=0){ state.employees[idx].rateHistory = emp.rateHistory; await saveJSON('employees', true, state.employees); }
          renderList();
          onChange && onChange();
        }
      };
    });
  }
  renderList();
}

/* ============================= ADMIN: DASHBOARD ============================= */
async function renderAdminDashboard(main){
  main.innerHTML = `
    <h2 class="page-title">${t('adminDashTitle')}</h2>
    <p class="page-sub">${t('adminDashSub')}</p>
    <div class="filters-row">
      <select id="f-month">${MONTHS.map(([v])=>`<option value="${v}">${monthLabel(v)}</option>`).join('')}</select>
      <select id="f-dept2"><option value="">${t('allDepts')}</option>${DEPARTMENTS.map(d=>`<option value="${d.id}">${deptName(d.id)}</option>`).join('')}</select>
      <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);"><input type="checkbox" id="f-show-resigned"/> ${t('showResigned')}</label>
    </div>
    <div id="admin-dash-body"><div class="empty-state">${t('loadingData')}</div></div>
  `;
  const monthSel = document.getElementById('f-month');
  const deptSel = document.getElementById('f-dept2');
  const showResignedChk = document.getElementById('f-show-resigned');
  const defaultMonth = currentDefaultMonth();
  monthSel.value = defaultMonth;
  monthSel.onchange = draw; deptSel.onchange = draw; showResignedChk.onchange = draw;
  draw();

  async function draw(){
    const month = monthSel.value;
    const deptFilter = deptSel.value;
    const showResigned = showResignedChk.checked;
    const body = document.getElementById('admin-dash-body');
    body.innerHTML = `<div class="empty-state">${t('loading')}</div>`;
    const allEntries = await loadAllTimesheetsForMonth(month);
    const visibleEmps = state.employees.filter(e=>(!deptFilter || e.department===deptFilter) && employeeActiveInMonth(e, month) && (showResigned || employeeCountsInMonth(e, month)));
    const [notesMap, targetsMap, approvedMap] = await Promise.all([
      loadAllNotesForMonth(visibleEmps.map(e=>e.id), month),
      loadAllTargetsForMonth(visibleEmps.map(e=>e.id), month),
      loadAllApprovedForMonth(visibleEmps.map(e=>e.id), month),
    ]);

    let sumTarget=0, sumProject=0, sumLogged=0, activeCount=0, sumCost=0, sumProjectCost=0;
    let countFulltime=0, countParttime=0, countStandby=0, countInactive=0;
    visibleEmps.forEach(e=>{
      if(e.status==='active_fulltime') countFulltime++;
      else if(e.status==='active_parttime') countParttime++;
      else if(e.status==='standby') countStandby++;
      else if(e.status==='inactive') countInactive++;
    });
    const perEmp = visibleEmps.map(e=>{
      const counts = employeeCountsInMonth(e, month);
      if(counts) activeCount++;
      const entries = allEntries[e.id] || [];
      const s = summarizeEntries(entries);
      const target = counts ? effectiveTarget(e, targetsMap[e.id]) : 0;
      const approvedOverride = approvedMap[e.id];
      const effectiveTotal = counts ? ((approvedOverride===null || approvedOverride===undefined) ? s.total : approvedOverride) : 0;
      // Cost only reflects billable work — project hours (per project) and proposal/tender hours —
      // computed per logged entry using the hourly rate effective on that entry's own date, so a
      // mid-month rate change is reflected correctly. Training and free time are not costed.
      const billableHours = counts ? entries.reduce((sum,en)=> (en.type==='project'||en.type==='tender') ? sum+en.hours : sum, 0) : 0;
      const projectCost = counts ? entries.reduce((sum,en)=> en.type==='project' ? sum + en.hours*rateAt(e,en.date) : sum, 0) : 0;
      const proposalCost = counts ? entries.reduce((sum,en)=> en.type==='tender' ? sum + en.hours*rateAt(e,en.date) : sum, 0) : 0;
      const cost = projectCost + proposalCost;
      // "rate" shown in the table is the blended rate actually applied this month (cost ÷ billable hours),
      // so Rate × billable hours always reconciles exactly with the Cost column — even when the employee's
      // hourly rate changed partway through the month. Falls back to the rate effective at month-end
      // when there are no billable hours to blend.
      const rate = billableHours ? (cost/billableHours) : rateAt(e, monthEndDateStr(month));
      sumTarget += target; sumProject += (counts ? s.project : 0); sumLogged += effectiveTotal;
      sumCost += cost; sumProjectCost += projectCost;
      return {emp:e, s, target, effectiveTotal, counts, cost, projectCost, proposalCost, rate, note: notesMap[e.id] || {annual:0, unpaid:0, holiday:0}};
    });
    const overallUtil = sumTarget ? (sumProject/sumTarget*100) : 0;

    // per department aggregation (ignore deptFilter for chart breadth unless set)
    const deptAgg = {};
    DEPARTMENTS.forEach(d=>deptAgg[d.id]={target:0, project:0, logged:0});
    state.employees.filter(e=>employeeActiveInMonth(e, month)).forEach(e=>{
      const counts = employeeCountsInMonth(e, month);
      if(!counts) return;
      const entries = allEntries[e.id] || [];
      const s = summarizeEntries(entries);
      deptAgg[e.department].target += e.targetHours;
      deptAgg[e.department].project += s.project;
      deptAgg[e.department].logged += s.total;
    });

    // per project aggregation (hours + labor cost, using each employee's hourly rate)
    const prjAgg = {};
    state.projects.forEach(p=>prjAgg[p.id]={hours:0, cost:0, name:p.name});
    Object.entries(allEntries).forEach(([empId, empEntries])=>{
      const owner = state.employees.find(x=>x.id===empId);
      (empEntries||[]).forEach(en=>{
        if(en.type==='project' && prjAgg[en.projectId]){
          prjAgg[en.projectId].hours += en.hours;
          prjAgg[en.projectId].cost += en.hours*rateAt(owner,en.date);
        }
      });
    });

    body.innerHTML = `
      <div class="cards-row">
        <div class="stat-card"><div class="lbl">${empStatusLabel('active_fulltime')}</div><div class="val">${countFulltime}</div></div>
        <div class="stat-card"><div class="lbl">${empStatusLabel('active_parttime')}</div><div class="val">${countParttime}</div></div>
        <div class="stat-card"><div class="lbl">${empStatusLabel('standby')}</div><div class="val">${countStandby}</div></div>
        <div class="stat-card"><div class="lbl">${empStatusLabel('inactive')}</div><div class="val">${countInactive}</div></div>
        <div class="stat-card"><div class="lbl">${t('totalTargetHours')}</div><div class="val mono">${fmt(sumTarget)}</div></div>
        <div class="stat-card"><div class="lbl">${t('totalPrjHours')}</div><div class="val mono">${fmt(sumProject)}</div></div>
        <div class="stat-card"><div class="lbl">${t('overallUtil')}</div><div class="val mono" style="color:${utilColor(overallUtil)}">${fmt(overallUtil)}%</div></div>
        <div class="stat-card"><div class="lbl">${t('totalLaborCostLbl')}</div><div class="val mono">${fmt(sumCost)}</div></div>
      </div>
      <div class="grid2">
        <div class="panel">
          <div class="panel-title">${t('utilByDept')}</div>
          <div class="chart-box"><canvas id="chart-dept"></canvas></div>
        </div>
        <div class="panel">
          <div class="panel-title">${t('hoursByType')}</div>
          <div class="chart-box"><canvas id="chart-type"></canvas></div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-title">${t('utilByPrj')}</div>
        <div class="chart-box"><canvas id="chart-prj"></canvas></div>
        <div class="util-table-wrap" style="margin-top:14px;"><table id="prj-cost-table" class="util-emp-table"></table></div>
      </div>
      <div class="panel">
        <div class="panel-title">${t('detailsByEmp')}</div>
        <div class="util-table-wrap"><table id="emp-util-table" class="util-emp-table"></table></div>
      </div>
    `;

    // Dept chart
    const deptLabels = DEPARTMENTS.map(d=>d.id);
    const deptUtils = DEPARTMENTS.map(d=> deptAgg[d.id].target ? (deptAgg[d.id].project/deptAgg[d.id].target*100) : 0);
    mkChart('chart-dept','bar', {
      labels: deptLabels,
      datasets:[{label:'Utilization %', data:deptUtils, backgroundColor: DEPARTMENTS.map(d=>d.color)}]
    }, {scales:{y:{beginAtZero:true,max:120,ticks:{color:'#7C93A8'},grid:{color:'#D7E4F2'}},x:{ticks:{color:'#7C93A8'},grid:{display:false}}}, plugins:{legend:{display:false}}});

    // type breakdown pie (all active emps this month)
    const typeSums = {project:0,training:0,tender:0,free:0};
    perEmp.forEach(({s})=>{ typeSums.project+=s.project; typeSums.training+=s.training; typeSums.tender+=s.tender; typeSums.free+=s.free; });
    mkChart('chart-type','doughnut', {
      labels: Object.keys(ENTRY_TYPES).map(k=>entryLabel(k)),
      datasets:[{data:Object.keys(ENTRY_TYPES).map(k=>typeSums[k]), backgroundColor:Object.keys(ENTRY_TYPES).map(k=>ENTRY_TYPES[k].color)}]
    }, {plugins:{legend:{position:'bottom',labels:{color:'#122347',font:{size:11}}}}});

    // project chart
    const prjEntries = Object.entries(prjAgg).filter(([,v])=>v.hours>0);
    mkChart('chart-prj','bar', {
      labels: prjEntries.map(([,v])=>v.name),
      datasets:[{label:t('loggedHours'), data:prjEntries.map(([,v])=>v.hours), backgroundColor:'#2F7FD4'}]
    }, {indexAxis:'y', scales:{x:{beginAtZero:true,ticks:{color:'#7C93A8'},grid:{color:'#D7E4F2'}},y:{ticks:{color:'#7C93A8'},grid:{display:false}}}, plugins:{legend:{display:false}}});

    // project cost table
    const prjCostTbl = document.getElementById('prj-cost-table');
    prjCostTbl.innerHTML = `
      <thead><tr><th>${t('thPrjName')}</th><th>${t('loggedHours')}</th><th>${t('capThCost')}</th></tr></thead>
      <tbody>
      ${prjEntries.map(([,v])=>`
        <tr><td>${v.name}</td><td class="mono">${fmt(v.hours)}</td><td class="mono">${fmt(v.cost)}</td></tr>
      `).join('') || `<tr><td colspan="3"><div class="empty-state">${t('noDataMonth')}</div></td></tr>`}
      <tr style="font-weight:700;"><td>${t('capThTotal')}</td><td class="mono">${fmt(prjEntries.reduce((a,[,v])=>a+v.hours,0))}</td><td class="mono">${fmt(prjEntries.reduce((a,[,v])=>a+v.cost,0))}</td></tr>
      </tbody>
    `;

    // ---- Utilization Emp table (grouped headers) ----
    const tbl = document.getElementById('emp-util-table');
    tbl.innerHTML = `
      <thead>
        <tr>
          <th rowspan="2">${t('thCode')}</th>
          <th rowspan="2">${t('thEmployee')}</th>
          <th rowspan="2">${t('thDept')}</th>
          <th rowspan="2">${t('thTargetShort')}</th>
          <th colspan="3" class="grp-th grp-approved">${t('grpApproved')}</th>
          <th colspan="5" class="grp-th grp-dist">${t('grpDistribution')}</th>
          <th colspan="5" class="grp-th grp-util">${t('grpUtilization')}</th>
          <th colspan="2" class="grp-th grp-cost">${t('empCostLbl')}</th>
          <th colspan="3" class="grp-th grp-note">${t('grpNote')}</th>
          <th rowspan="2"></th>
        </tr>
        <tr>
          <th class="grp-approved">${t('colOnsite')}</th>
          <th class="grp-approved">${t('colRemotly')}</th>
          <th class="grp-approved">${t('colTotal')}</th>
          <th class="grp-dist">${t('colProjects')}</th>
          <th class="grp-dist">${t('colProposal')}</th>
          <th class="grp-dist">${t('colTraining')}</th>
          <th class="grp-dist">${t('colFreeTime')}</th>
          <th class="grp-dist">${t('colTotal')}</th>
          <th class="grp-util">${t('colUtilManHours')}</th>
          <th class="grp-util">${t('colUtilProjects')}</th>

function mkChart(canvasId, type, data, extraOptions){
  if(state.charts[canvasId]) state.charts[canvasId].destroy();
  const ctx = document.getElementById(canvasId);
  if(!ctx) return;
  state.charts[canvasId] = new Chart(ctx, {
    type, data,
    options: Object.assign({responsive:true, maintainAspectRatio:false}, extraOptions||{})
  });
}

function currentDefaultMonth(){
  // default to a month within the tracked range closest to "today"
  const today = new Date();
  const y = today.getFullYear(), m = today.getMonth()+1;
  const cand = `${y}-${String(m).padStart(2,'0')}`;
  const valid = MONTHS.find(([v])=>v===cand);
  return valid ? cand : MONTHS[0][0];
}

          <label style="display:block;font-size:11px;color:var(--muted);margin-bottom:4px;">${t('capFilterTo')}</label>

          <label style="display:block;font-size:11px;color:var(--muted);margin-bottom:4px;">&nbsp;</label>

  const toSel = document.getElementById('cap-to');

    let fromIdx = MONTHS.findIndex(([v])=>v===fromSel.value);

    if(fromIdx<0) fromIdx=0; if(toIdx<0) toIdx=MONTHS.length-1;
    if(fromIdx>toIdx){ const tmp=fromIdx; fromIdx=toIdx; toIdx=tmp; }
    const monthsRange = MONTHS.slice(fromIdx, toIdx+1).map(m=>m[0]);
    const numMonths = monthsRange.length || 1;

    const empFilter = empSel.value;

    const prjFilter = prjSel.value;

      (!empFilter || e.id===empFilter)

      && employeeActiveInMonth(e, lastMonthInRange)
      && (showResigned || employeeCountsInMonth(e, lastMonthInRange)));
    const empIds = employees.map(e=>e.id);

    // aggregate target/available/effective/training/idle per employee across the month range
    const perEmpAgg = {};

    for(const month of monthsRange){

      employees.forEach(e=>{

        agg.target += target;

/* ============================= ADMIN: ATTENDANCE (IN/OUT per day) ============================= */
function parseAttendanceDetailRows(rows, monthValue, fallbackDateStr){
  // Same flexible column matching as parseAttendanceRows, but keeps per-day IN/OUT detail
  // instead of a monthly total. Returns { [employeeId]: [{date, in, out, hours}, ...] }
  // Columns can appear in any order. If the file has no Date column, fallbackDateStr
  // (e.g. the date currently selected on the page) is applied to every row instead.
  if(!rows || !rows.length) return {};
  const sampleKeys = Object.keys(rows[0]);
  const findKey = (patterns)=> sampleKeys.find(k=> patterns.some(p=> k.toString().toLowerCase().includes(p)));
  const codeKey = findKey(['code','كود']);
  const nameKey = findKey(['name','اسم']);
  const dateKey = findKey(['date','تاريخ']);
  const inKey = findKey(['check in','checkin','in time','time in','حضور']);
  const outKey = findKey(['check out','checkout','out time','time out','انصراف']);
  if(!inKey || !outKey) return {};
  if(!dateKey && !fallbackDateStr) return {};

  const empByCode = {}; state.employees.forEach(e=>{ if(e.code) empByCode[String(e.code).trim().toLowerCase()] = e; });
  const empByName = {}; state.employees.forEach(e=>{ empByName[String(e.name).trim().toLowerCase()] = e; });
  const resolveEmp = (row)=>{
    if(codeKey && row[codeKey]!==undefined && row[codeKey]!=='') {
      const emp = empByCode[String(row[codeKey]).trim().toLowerCase()];
      if(emp) return emp;
    }
    if(nameKey && row[nameKey]){
      const emp = empByName[String(row[nameKey]).trim().toLowerCase()];
      if(emp) return emp;
    }
    return null;
  };
  const toDateObj = (v)=>{
    if(v instanceof Date) return v;
    if(typeof v==='number') return new Date(Math.round((v-25569)*86400*1000));
    if(typeof v==='string'){
      const s = v.trim();
      let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
      if(m) return new Date(+m[1], +m[2]-1, +m[3]);
      m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
      if(m){
        const a=+m[1], b=+m[2], y=+m[3];
        if(a>12) return new Date(y, b-1, a);
        if(b>12) return new Date(y, a-1, b);
        return new Date(y, b-1, a); // ambiguous DD/MM vs MM/DD: default to DD/MM
      }
    }
    const d = new Date(v); return isNaN(d) ? null : d;
  };
  const pad2 = n=>String(n).padStart(2,'0');
  const toTimeStr = (v)=>{
    if(v instanceof Date) return `${pad2(v.getHours())}:${pad2(v.getMinutes())}`;
    if(typeof v==='number') { const d = new Date(Math.round((v-25569)*86400*1000)); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }
    if(typeof v==='string'){
      const s = v.trim();
      const m = s.match(/^(\d{1,2}):(\d{2})(?::\d{2})?\s*(AM|PM|am|pm)?$/);
      if(m){
        let h = parseInt(m[1],10); const mi = parseInt(m[2],10); const ap = m[3] ? m[3].toUpperCase() : null;
        if(ap==='PM' && h<12) h += 12;
        if(ap==='AM' && h===12) h = 0;
        if(h<24 && mi<60) return `${pad2(h)}:${pad2(mi)}`;
      }
    }
    return '';
  };

  const fallbackDateObj = fallbackDateStr ? toDateObj(fallbackDateStr) : null;
  const out = {};
  for(const row of rows){
    const emp = resolveEmp(row);
    if(!emp) continue;
    const dateObj = dateKey ? toDateObj(row[dateKey]) : fallbackDateObj;
    if(!dateObj) continue;
    if(!dateInFiscalRange(dateObj, monthValue)) continue;
    const inStr = toTimeStr(row[inKey]);
    const outStr = toTimeStr(row[outKey]);
    const hours = attendanceHoursDiff(inStr, outStr);
    if(!inStr || !outStr || hours<=0) continue;
    const dateStr = toDateStr(dateObj);
    if(!out[emp.id]) out[emp.id] = [];
    out[emp.id].push({date:dateStr, in:inStr, out:outStr, hours});
  }
  return out;
}

      if(hours<=0){ alert(t('outBeforeIn')); return; }
    }
    const month = monthOfDateStr(date) || monthSel.value;
    const days = await loadAttendance(empSel.value, month);
    const exists = days.some(d=>d.date===date);
    const updated = days.filter(d=>d.date!==date);
    updated.push({date, status, in:inV, out:outV, hours});
    if(month!==monthSel.value) monthSel.value = month;
    await saveAttendance(empSel.value, month, updated);
    await syncAttendanceToMonthlyData(empSel.value, month);
    toast(exists ? t('attendanceExistsOverwrite') : t('attendanceAdded'));
    draw();
  };

  document.getElementById('at-download-template').onclick = ()=>{
    const {start,end} = fiscalRange(monthSel.value);
    const rows = [];
    const cur = new Date(start);
    while(cur<=end){
      const dateStr = toDateStr(cur);
      state.employees.forEach(e=>{
        rows.push({Code:e.code||'', Name:e.name, Date:dateStr, 'Check In':'', 'Check Out':''});
      });
      cur.setDate(cur.getDate()+1);
    }
    const ws = XLSX.utils.json_to_sheet(rows);
    ws['!cols'] = [{wch:10},{wch:26},{wch:12},{wch:10},{wch:10}];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Attendance');
    XLSX.writeFile(wb, `attendance-template-${monthSel.value}.xlsx`);
  };

  document.getElementById('at-import').onclick = async ()=>{
    const fileInput = document.getElementById('at-file');
    const resultBox = document.getElementById('at-import-result');
    if(!fileInput.files || !fileInput.files[0]){ resultBox.textContent = t('chooseFile'); return; }
    resultBox.textContent = t('loading');
    try{
      const buf = await fileInput.files[0].arrayBuffer();
      const wb = XLSX.read(buf, {type:'array', cellDates:true});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
      const byEmp = parseAttendanceDetailRows(rows, monthSel.value, dateInput.value || null);
      const empIds = Object.keys(byEmp);
      if(empIds.length===0){
        resultBox.textContent = t('importedAttendanceNoMatch');
        return;
      }
      let totalDays = 0;
      for(const empId of empIds){
        const newDays = byEmp[empId].map(d=>({...d, status:'present'}));
        const existing = await loadAttendance(empId, monthSel.value);
        const newDates = new Set(newDays.map(d=>d.date));
        const merged = existing.filter(d=>!newDates.has(d.date)).concat(newDays);
        await saveAttendance(empId, monthSel.value, merged);
        await syncAttendanceToMonthlyData(empId, monthSel.value);
        totalDays += newDays.length;
      }
      resultBox.innerHTML = `<span class="badge" style="background:#2F7FD422;color:#2F7FD4;">${t('importedAttendanceDays')} ${totalDays} (${empIds.length})</span>`;
      draw();
    }catch(e){
      resultBox.textContent = 'Error: ' + e.message;
    }
  };

  draw();
  async function draw(){
    const days = await loadAttendance(empSel.value, monthSel.value);
    days.sort((a,b)=> a.date<b.date?-1:1);
    const tbl = document.getElementById('at-table');
    tbl.innerHTML = `
      <tr><th>${t('thDate')}</th><th>${t('attStatus')}</th><th>${t('thIn')}</th><th>${t('thOut')}</th><th>${t('thActualHours')}</th><th></th></tr>
      ${days.map(d=>{
        const status = d.status || 'present';
        const info = ATTENDANCE_STATUSES[status] || ATTENDANCE_STATUSES.present;
        return `
        <tr>
          <td class="mono">${d.date}</td>
          <td><span style="color:${info.color}">${attendanceStatusLabel(status)}</span></td>
          <td class="mono">${d.in || '—'}</td>
          <td class="mono">${d.out || '—'}</td>
          <td class="mono">${fmt(d.hours||0)}</td>
          <td><button class="icon-btn" data-date="${d.date}" style="color:var(--rose)">${t('del')}</button></td>
        </tr>`;}).join('') || `<tr><td colspan="6"><div class="empty-state">${t('noAttendanceYet')}</div></td></tr>`}
    `;
    tbl.querySelectorAll('.icon-btn').forEach(b=>{
      b.onclick = async ()=>{
        const updated = days.filter(d=>d.date!==b.dataset.date);
        await saveAttendance(empSel.value, monthSel.value, updated);
        await syncAttendanceToMonthlyData(empSel.value, monthSel.value);
        draw();
      };
    });
  }
}

/* Flexible attendance-sheet parser: matches employee code/name and either a ready
   "Hours" column, or Date + Check-in + Check-out columns, and sums hours per
   employee within the given fiscal month period. Returns { [employeeCode]: totalHours } */
function parseAttendanceRows(rows, monthValue){
  if(!rows || !rows.length) return {};
  const sampleKeys = Object.keys(rows[0]);
  const findKey = (patterns)=> sampleKeys.find(k=> patterns.some(p=> k.toString().toLowerCase().includes(p)));
  const codeKey = findKey(['code','كود']);
  const nameKey = findKey(['name','اسم']);
  const hoursKey = findKey(['hours','ساعات','ساعة']);
  const dateKey = findKey(['date','تاريخ']);
  const inKey = findKey(['check in','checkin','in time','time in','حضور']);
  const outKey = findKey(['check out','checkout','out time','time out','انصراف']);

  const empByCode = {}; state.employees.forEach(e=>{ if(e.code) empByCode[String(e.code).trim().toLowerCase()] = e; });
  const empByName = {}; state.employees.forEach(e=>{ empByName[String(e.name).trim().toLowerCase()] = e; });

  const totals = {};
  const addHours = (emp, hours)=>{
    if(!emp || !isFinite(hours) || hours<=0) return;
    totals[emp.code || emp.id] = (totals[emp.code || emp.id] || 0) + hours;
  };
  const resolveEmp = (row)=>{
    if(codeKey && row[codeKey]!==undefined && row[codeKey]!=='') {
      const emp = empByCode[String(row[codeKey]).trim().toLowerCase()];
      if(emp) return emp;
    }
    if(nameKey && row[nameKey]){
      const emp = empByName[String(row[nameKey]).trim().toLowerCase()];
      if(emp) return emp;
    }
    return null;
  };
  const toDate = (v)=>{
    if(v instanceof Date) return v;
    if(typeof v==='number') return new Date(Math.round((v-25569)*86400*1000));
    const d = new Date(v); return isNaN(d) ? null : d;
  };
  const toHoursDiff = (a,b)=>{
    const da=toDate(a), db=toDate(b);
    if(!da||!db) return 0;
    const diff = (db-da)/3600000;
    return diff>0 && diff<24 ? diff : 0;
  };

  for(const row of rows){
    const emp = resolveEmp(row);
    if(!emp) continue;
    const rowDate = dateKey ? toDate(row[dateKey]) : null;
    if(rowDate && !dateInFiscalRange(rowDate, monthValue)) continue;
    if(hoursKey && row[hoursKey]!==''){
      addHours(emp, Number(row[hoursKey])||0);
    } else if(inKey && outKey){
      addHours(emp, toHoursDiff(row[inKey], row[outKey]));
    }
  }
  return totals;
}

/* ============================= ENGINEER: MY TIMESHEET ============================= */
async function renderMyTimesheet(main){
  const emp = state.currentUser;
  main.innerHTML = `
    <h2 class="page-title">${t('myTsTitle')} ${emp.name}</h2>
    <p class="page-sub">${t('myTsSub')}</p>
    <div class="filters-row"><select id="my-month">${MONTHS.map(([v])=>`<option value="${v}">${monthLabel(v)}</option>`).join('')}</select></div>
    <p class="page-sub" id="my-ts-period" style="margin-top:-14px;"></p>
    <div class="panel">
      <div class="panel-title">${t('addNewEntry')}</div>
      <div class="row2">
        <div class="field"><label>${t('date')}</label><input type="date" id="e-date"/>
          <div id="e-date-hint" style="font-size:11.5px;color:var(--muted);margin-top:4px;"></div>
        </div>
        <div class="field"><label>${t('type')}</label>
          <select id="e-type">
            <option value="project">${t('project')}</option>
            <option value="training">${t('training')}</option>
            <option value="tender">${t('tender')}</option>
            <option value="free">${t('freetime')}</option>
            <option value="admin">${t('admin')}</option>
          </select>
        </div>
      </div>
      <div class="row2">
        <div class="field" id="e-prj-wrap"><label>${t('thProject')}</label>
          <select id="e-prj">${state.projects.filter(p=>p.status==='active').map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select>
        </div>
        <div class="field"><label>${t('hoursCount')}</label><input type="number" id="e-hours" min="0.5" step="0.5" value="8"/></div>
      </div>
      <div class="field"><label>${t('workLocation')}</label>
        <select id="e-loc"><option value="onsite">${t('onsite')}</option><option value="remote">${t('remote')}</option></select>
      </div>
      <button class="btn btn-solid" id="e-add">${t('addBtn')}</button>
    </div>
    <div class="panel">
      <div class="panel-title">
        ${t('monthEntries')}
        <span>
          <span class="mono" id="month-total" style="color:var(--cyan);font-size:13px;"></span>
          <span id="my-ts-approval" style="margin-inline-start:12px;font-size:12.5px;"></span>
        </span>
      </div>
      <table id="my-ts-table"></table>
    </div>
  `;
  const monthSel = document.getElementById('my-month');
  monthSel.value = currentDefaultMonth();
  document.getElementById('e-date').value = new Date().toISOString().slice(0,10);
  updateDateHint();
  document.getElementById('e-type').onchange = (e)=>{
    document.getElementById('e-prj-wrap').style.display = e.target.value==='project' ? '' : 'none';
  };
  monthSel.onchange = draw;
  document.getElementById('e-add').onclick = addEntry;
  document.getElementById('e-date').onchange = updateDateHint;
  draw();

  async function updateDateHint(){
    const date = document.getElementById('e-date').value;
    const hintEl = document.getElementById('e-date-hint');
    if(!date || emp.status!=='active_fulltime'){ hintEl.textContent = ''; return; }
    const month = monthOfDateStr(date) || monthSel.value;
    const days = await loadAttendance(emp.id, month);
    const rec = days.find(d=>d.date===date);
    if(rec){
      const status = rec.status || 'present';
      const entries = await loadTimesheet(emp.id, month);
      const already = entries.filter(e=>e.date===date).reduce((a,e)=>a+Number(e.hours||0),0);
      if(status!=='present'){
        hintEl.innerHTML = `<span style="color:${(ATTENDANCE_STATUSES[status]||{}).color||'inherit'}">${attendanceStatusLabel(status)}</span> — ${t('availableToDistribute')}: <b class="mono">0.0</b>`;
      } else {
        const remaining = Math.round((rec.hours - already)*100)/100;
        const remColor = remaining>0.01 ? 'var(--amber)' : (remaining<-0.01 ? 'var(--rose)' : 'var(--green)');
        hintEl.innerHTML = `${t('dailyTargetHint')}: <b class="mono">${fmt(rec.hours)}</b> — ${t('total')}: <span class="mono">${fmt(already)}</span> — ${t('availableToDistribute')}: <b class="mono" style="color:${remColor}">${fmt(remaining)}</b>`;
      }
    } else {
      hintEl.textContent = t('noAttendanceForDate');
    }
  }

  async function addEntry(){
    const date = document.getElementById('e-date').value;
    const type = document.getElementById('e-type').value;
    const hours = Number(document.getElementById('e-hours').value);
    const loc = document.getElementById('e-loc').value;
    const projectId = type==='project' ? document.getElementById('e-prj').value : null;
    if(!date || !hours || hours<=0){ alert(t('fillDateHours')); return; }
    const [dy,dm,dd] = date.split('-').map(Number);
    const localDate = new Date(dy, dm-1, dd);
    if(emp.hireDate){
      const [hy,hm,hd] = emp.hireDate.split('-').map(Number);
      if(hy && hm && hd && localDate < new Date(hy, hm-1, hd)){ alert(t('dateBeforeHire')); return; }
    }
    if(!dateInFiscalRange(localDate, monthSel.value)){ alert(t('dateOutOfMonth')+' '+monthLabel(monthSel.value)+' ('+fiscalRangeLabel(monthSel.value)+')'); return; }
    if(type==='project' && !projectId){ alert(t('chooseProject')); return; }
    const entries = await loadTimesheet(emp.id, monthSel.value);
    entries.push({id:uid('e'), date, type, projectId, hours, location:loc, approved:false, approvedBy:null, approvedAt:null});
    await saveTimesheet(emp.id, monthSel.value, entries);
    const days = await loadAttendance(emp.id, monthSel.value);
    const rec = emp.status==='active_fulltime' ? days.find(d=>d.date===date) : null;
    if(rec){
      const status = rec.status || 'present';
      const dayTotal = entries.filter(e=>e.date===date).reduce((a,e)=>a+Number(e.hours||0),0);
      if(Math.abs(dayTotal - rec.hours) > 0.01){
        const msg = status!=='present'
          ? `${attendanceStatusLabel(status)} — ${t('dailyMismatchWarning')} (${fmt(dayTotal)} / 0.0)`
          : `${t('dailyMismatchWarning')} (${fmt(dayTotal)} / ${fmt(rec.hours)})`;
        toast(msg);
        draw(); updateDateHint();
        return;
      }
    }
    toast(t('entryAdded'));
    draw(); updateDateHint();
  }

  async function draw(){
    document.getElementById('my-ts-period').textContent = `${t('fiscalPeriodLbl')} ${fiscalRangeLabel(monthSel.value)}`;
    const entries = await loadTimesheet(emp.id, monthSel.value);
    entries.sort((a,b)=> a.date<b.date?-1:1);
    const s = summarizeEntries(entries);
    document.getElementById('month-total').textContent = `${t('total')}: ${fmt(s.total)} / ${t('target')} ${emp.targetHours}`;
    const appr = await loadDataApproval(emp.id, monthSel.value);
    document.getElementById('my-ts-approval').innerHTML = `${t('thApprovalStatus')}: ${approvalStatusBadge(appr.status)}`;
    const tbl = document.getElementById('my-ts-table');
    tbl.innerHTML = `
      <tr><th>${t('thDate')}</th><th>${t('thType')}</th><th>${t('thProject')}</th><th>${t('thHours')}</th><th>${t('thLocation')}</th><th>${t('thApprovedCol')}</th><th></th></tr>
      ${entries.map(e=>`
        <tr>
          <td class="mono">${e.date}</td>
          <td><span style="color:${ENTRY_TYPES[e.type].color}">${entryLabel(e.type)}</span></td>
          <td>${e.type==='project' ? (state.projects.find(p=>p.id===e.projectId)?.name || '—') : '—'}</td>
          <td class="mono">${e.hours}</td>
          <td>${locLabel(e.location)}</td>
          <td>${e.approved ? `<span style="color:var(--green)">● ${t('entryApprovedBadge')}</span>` : `<span style="color:var(--amber)">● ${t('entryPendingBadge')}</span>`}</td>
          <td>${e.approved ? '—' : `<button class="icon-btn" data-id="${e.id}" style="color:var(--rose)">${t('del')}</button>`}</td>
        </tr>`).join('') || `<tr><td colspan="7"><div class="empty-state">${t('noEntriesYet')}</div></td></tr>`}
    `;
    tbl.querySelectorAll('.icon-btn').forEach(b=>{
      b.onclick = async ()=>{
        const newEntries = entries.filter(e=>e.id!==b.dataset.id);
        await saveTimesheet(emp.id, monthSel.value, newEntries);
        draw();
      };
    });
  }
}

  const emp = state.currentUser;

    <p class="page-sub">${emp.name} — ${deptName(emp.department)}</p>

  `;

      <div class="cards-row">
        <div class="stat-card"><div class="lbl">${t('targetHoursLbl')}</div><div class="val mono">${emp.targetHours}</div></div>
        <div class="stat-card"><div class="lbl">${t('totalLoggedHoursLbl')}</div><div class="val mono">${fmt(s.total)}</div></div>
        <div class="stat-card"><div class="lbl">${t('thPrjHours')}</div><div class="val mono">${fmt(s.project)}</div></div>
        <div class="stat-card"><div class="lbl">Utilization</div><div class="val mono" style="color:${utilColor(util)}">${fmt(util)}%</div></div>
      </div>
      <div class="grid2b">
        <div class="panel">
          <div class="panel-title">${t('hoursDistribution')}</div>
          <div class="chart-box"><canvas id="chart-my-type"></canvas></div>
        </div>
        <div class="panel">
          <div class="panel-title">${t('attendanceRatio')}</div>
          <div style="padding:20px 0;">
            <div style="display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:6px;">
              <span>${t('approvedAttendance')}</span><span class="mono">${fmt(attendance)}%</span>
            </div>
            <div class="util-bar-wrap" style="width:100%;height:14px;"><div class="util-bar-fill" style="width:${Math.min(attendance,100)}%;background:${utilColor(attendance)};height:100%;"></div></div>
            <p style="color:var(--muted);font-size:11.5px;margin-top:14px;line-height:1.8;">
              ${t('attendanceNote')}
            </p>
          </div>
        </div>
      </div>
    `;
    mkChart('chart-my-type','doughnut', {
      labels: Object.keys(ENTRY_TYPES).map(k=>entryLabel(k)),
      datasets:[{data:Object.keys(ENTRY_TYPES).map(k=>s[k]||0), backgroundColor:Object.keys(ENTRY_TYPES).map(k=>ENTRY_TYPES[k].color)}]
    }, {plugins:{legend:{position:'bottom',labels:{color:'#122347',font:{size:11}}}}});
  }

  async function drawTrend(){
    const labels=[], utils=[];
    for(const [v] of MONTHS){
      const entries = await loadTimesheet(emp.id, v);
      const s = summarizeEntries(entries);
      labels.push(monthLabel(v).split(' ')[0]);
      utils.push(emp.targetHours ? (s.project/emp.targetHours*100) : 0);
    }
    mkChart('chart-trend','line', {
      labels,
      datasets:[{label:'Utilization %', data:utils, borderColor:'#2F7FD4', backgroundColor:'rgba(47,127,212,.15)', fill:true, tension:.3}]
    }, {scales:{y:{beginAtZero:true,max:120,ticks:{color:'#7C93A8'},grid:{color:'#D7E4F2'}},x:{ticks:{color:'#7C93A8'},grid:{display:false}}}, plugins:{legend:{display:false}}});
  }
}
